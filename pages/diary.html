<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日记</title>
    <script src="desktop-theme-preload.js"></script>
    <script defer src="offline-assets/offline-assets-manifest.js"></script>
    <script defer src="desktop-common-boot.js"></script>
    <script defer src="diary-boot.js"></script>
    <link rel="stylesheet" href="index.css" />
</head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      height: auto;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
        sans-serif;
    }
  </style>
  <body class="app-layout page-diary diary-bootstrap-pending bkg flex row">
    <div class="app-sidebar flex column ms mgt mgb">
      <div class="app-sidebar-spacer flex ms"></div>
      <div class="app-nav flex flex1 column ms mgt">
        <button class="bts" type="button" data-nav-page="index" onclick="if (window.ControlerUI?.navigateAppPage?.('index')) return false; window.location.href = 'index.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="7.25"></circle>
              <path d="M12 8.35v4.1l2.65 1.7"></path>
            </svg>
          </span>
          <span class="app-nav-label">记录</span>
        </button>
        <button class="bts" type="button" data-nav-page="stats" onclick="if (window.ControlerUI?.navigateAppPage?.('stats')) return false; window.location.href = 'stats.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 19.25h15"></path>
              <path d="M7.25 17.75v-5.5"></path>
              <path d="M12 17.75V7.25"></path>
              <path d="M16.75 17.75v-8"></path>
            </svg>
          </span>
          <span class="app-nav-label">统计</span>
        </button>
        <button class="bts" type="button" data-nav-page="plan" onclick="if (window.ControlerUI?.navigateAppPage?.('plan')) return false; window.location.href = 'plan.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4.5" y="5.75" width="15" height="13.25" rx="3"></rect>
              <path d="M8 3.75v4"></path>
              <path d="M16 3.75v4"></path>
              <path d="M4.5 9.75h15"></path>
            </svg>
          </span>
          <span class="app-nav-label">计划</span>
        </button>
        <button class="bts" type="button" data-nav-page="todo" onclick="if (window.ControlerUI?.navigateAppPage?.('todo')) return false; window.location.href = 'todo.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5.25" y="4.75" width="13.5" height="14.5" rx="3"></rect>
              <path d="M8.5 9.25h6.75"></path>
              <path d="M8.5 13h6.75"></path>
              <path d="M8.5 16.75h4.25"></path>
              <path d="M6.8 9.2h.01"></path>
              <path d="M6.8 12.95h.01"></path>
              <path d="M6.8 16.7h.01"></path>
            </svg>
          </span>
          <span class="app-nav-label">待办</span>
        </button>
        <button class="bts" type="button" data-nav-page="diary" onclick="if (window.ControlerUI?.navigateAppPage?.('diary')) return false; window.location.href = 'diary.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 4.75h7.25L18 8.5V19.25H7a2.25 2.25 0 0 1-2.25-2.25V7A2.25 2.25 0 0 1 7 4.75Z"></path>
              <path d="M14.25 4.75V8.5H18"></path>
              <path d="M8.5 12h6.5"></path>
              <path d="M8.5 15h4.5"></path>
            </svg>
          </span>
          <span class="app-nav-label">日记</span>
        </button>
        <button class="bts" type="button" data-nav-page="settings" onclick="if (window.ControlerUI?.navigateAppPage?.('settings')) return false; window.location.href = 'settings.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8.7a3.3 3.3 0 1 0 0 6.6a3.3 3.3 0 0 0 0-6.6Z"></path>
              <path d="M19.15 13.1V10.9l-1.76-.46a5.83 5.83 0 0 0-.54-1.31l.95-1.56l-1.55-1.56l-1.57.95a5.86 5.86 0 0 0-1.3-.53L13.1 4.7h-2.2l-.46 1.73c-.46.12-.9.3-1.31.53l-1.56-.95L6.02 7.57l.95 1.56c-.23.41-.41.85-.53 1.31l-1.74.46v2.2l1.74.46c.12.46.3.9.53 1.31l-.95 1.56l1.55 1.56l1.56-.95c.41.23.85.41 1.31.53l.46 1.74h2.2l.46-1.74c.45-.12.89-.3 1.3-.53l1.57.95l1.55-1.56l-.95-1.56c.23-.41.42-.85.54-1.31Z"></path>
            </svg>
          </span>
          <span class="app-nav-label">设置</span>
        </button>
      </div>
    </div>

    <div class="app-main diary-main flex flex1 column mg ms">
      <div
        id="diary-loading-overlay"
        class="page-loading-overlay"
        data-mode="fullscreen"
        data-controler-overlay-scope="content"
        aria-hidden="true"
        hidden
      >
        <div class="page-loading-card">
          <div class="page-loading-title" data-loading-title>正在加载数据中</div>
          <div class="page-loading-message" data-loading-message>
            正在读取当前月份的日记与分类，请稍候
          </div>
        </div>
      </div>

      <div
        class="diary-shell page-shell page-shell--fill"
      >
        <div id="diary-guide-card" class="guide-card-host" hidden></div>
        <div class="page-shell-heading">
          <div class="page-shell-heading-copy">
            <h3 class="page-shell-heading-title">日记</h3>
          </div>
        </div>
        <div class="diary-filter-shell page-control-card">
          <div class="diary-filter-row">
            <div class="diary-filter-field diary-filter-field--year">
              <label for="diary-year-select" style="color: var(--text-color)"
                >年份</label
              >
              <select id="diary-year-select">
                <option value="">加载中...</option>
              </select>
            </div>
            <div class="diary-filter-field diary-filter-field--month">
              <label for="diary-month-select" style="color: var(--text-color)"
                >月份</label
              >
              <select id="diary-month-select">
                <option value="">加载中...</option>
              </select>
            </div>
            <div class="diary-filter-field diary-filter-field--category">
              <label
                for="diary-category-filter"
                style="color: var(--text-color)"
                >分类</label
              >
              <select id="diary-category-filter">
                <option value="all">全部</option>
              </select>
            </div>
            <div class="diary-filter-field diary-filter-field--search">
              <label for="diary-search-input" style="color: var(--text-color)"
                >搜索</label
              >
              <input
                id="diary-search-input"
                type="text"
                placeholder="搜索标题或正文关键词"
                autocomplete="off"
                style="
                  width: 100%;
                  min-width: 0;
                  padding: 10px 15px;
                  border-radius: 8px;
                  border: 1px solid var(--bg-tertiary);
                  background-color: var(--bg-quaternary);
                  color: var(--text-color);
                  font-size: 14px;
                "
              />
            </div>
          </div>
          <div class="diary-view-toggle-row">
            <button class="bts" id="diary-month-view-btn">月视图</button>
            <button class="bts" id="diary-list-view-btn">列表视图</button>
            <button class="bts" id="diary-category-btn">分类管理</button>
          </div>
        </div>
        <div
          id="diary-view-container"
          class="resizable-panel diary-view-surface"
        ></div>
      </div>
    </div>
</body>
</html>
