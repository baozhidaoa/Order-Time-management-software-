<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时间计划</title>
    <script src="desktop-theme-preload.js"></script>
    <script defer src="offline-assets/offline-assets-manifest.js"></script>
    <script defer src="desktop-common-boot.js"></script>
    <script defer src="plan-boot.js"></script>
    <link rel="stylesheet" href="index.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        height: auto;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
      }

      .plan-main {
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .plan-main::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      body.page-plan {
        --plan-fab-size: 76px;
        --plan-fab-icon-size: 30px;
        --plan-fab-offset-right: max(
          22px,
          calc(env(safe-area-inset-right, 0px) + 18px)
        );
        --plan-fab-offset-bottom: max(
          22px,
          calc(env(safe-area-inset-bottom, 0px) + 18px)
        );
        --plan-fab-bg: color-mix(
          in srgb,
          var(--panel-strong-bg) 92%,
          rgba(var(--accent-color-rgb), 0.08)
        );
        --plan-fab-bg-hover: color-mix(
          in srgb,
          var(--panel-strong-bg) 84%,
          rgba(var(--accent-color-rgb), 0.16)
        );
        --plan-fab-border: color-mix(
          in srgb,
          var(--panel-border-color) 80%,
          rgba(var(--accent-color-rgb), 0.16)
        );
        --plan-fab-icon-color: color-mix(
          in srgb,
          var(--text-color) 84%,
          var(--accent-color) 16%
        );
        --plan-fab-shadow: 0 18px 36px rgba(0, 0, 0, 0.22);
      }

      .planner-shell {
        gap: 16px;
        position: relative;
        min-height: auto;
        height: auto;
        flex: 0 0 auto;
        overflow: visible;
        padding-bottom: 0;
      }

      .planner-dashboard {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-auto-rows: max-content;
        gap: 0;
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        align-items: start;
        min-height: 0;
        height: auto;
        flex: 0 0 auto;
        overflow: visible;
        box-sizing: border-box;
      }

      .planner-panel {
        min-width: 0;
        padding: 20px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)),
          color-mix(in srgb, var(--panel-strong-bg) 92%, transparent);
        border: 1px solid
          color-mix(in srgb, var(--panel-border-color) 84%, rgba(255, 255, 255, 0.04));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 18px 38px rgba(0, 0, 0, 0.16);
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
        height: auto;
        flex-shrink: 0;
        overflow: visible;
      }

      .planner-panel-title {
        margin: 0 0 15px 0;
        color: var(--text-color);
        flex-shrink: 0;
      }

      .planner-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 0;
        flex-wrap: wrap;
      }

      body.page-plan .planner-floating-action-slot {
        position: fixed;
        inset: auto
          var(--plan-fab-offset-right)
          var(--plan-fab-offset-bottom)
          auto;
        top: auto;
        right: var(--plan-fab-offset-right);
        bottom: var(--plan-fab-offset-bottom);
        left: auto;
        display: flex;
        width: auto;
        align-items: flex-end;
        justify-content: flex-end;
        margin: 0;
        min-height: 0;
        padding: 0;
        z-index: 74;
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          visibility 0.18s ease;
      }

      body.page-plan:not([data-plan-view="month"]) .planner-floating-action-slot {
        display: none !important;
      }

      body.page-plan #add-plan-btn-inline {
        position: relative;
        inset: auto;
        right: auto;
        bottom: auto;
        z-index: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 !important;
        width: var(--plan-fab-size);
        min-width: var(--plan-fab-size);
        height: var(--plan-fab-size);
        min-height: var(--plan-fab-size);
        padding: 0 !important;
        border-radius: 26px !important;
        border: 1px solid var(--plan-fab-border);
        background: var(--plan-fab-bg);
        box-shadow: var(--plan-fab-shadow);
        color: var(--plan-fab-icon-color);
        font-size: 0;
        line-height: 1;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        pointer-events: auto;
      }

      body.page-plan #add-plan-btn-inline:hover {
        background: var(--plan-fab-bg-hover);
        box-shadow: var(--plan-fab-shadow);
        transform: none;
      }

      body.page-plan #add-plan-btn-inline:focus-visible {
        outline: 2px solid rgba(var(--accent-color-rgb), 0.28);
        outline-offset: 3px;
      }

      body.page-plan .planner-inline-action__icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--plan-fab-icon-size);
        height: var(--plan-fab-icon-size);
        pointer-events: none;
      }

      body.page-plan .planner-inline-action__icon svg {
        width: 100%;
        height: 100%;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      body.desktop-widget-plan-page #add-plan-btn-inline {
        display: none !important;
      }

      body.controler-mobile-runtime.controler-keyboard-open.page-plan
        .planner-floating-action-slot,
      body.controler-android-native.controler-keyboard-open.page-plan
        .planner-floating-action-slot {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(12px);
      }

      .planner-panel-note {
        color: var(--muted-text-color);
        font-size: 13px;
      }

      .planner-panel--plans {
        gap: 16px;
        padding: 0;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0;
      }

      .todo-panel-stack {
        display: flex;
        flex-direction: column;
        gap: 15px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: visible;
      }

      .todo-stats-card,
      .checkin-stats-card {
        min-width: 0;
      }

      .todo-item {
        background-color: var(--bg-tertiary);
        border-radius: 22px;
        padding: 12px;
        margin-bottom: 10px;
        color: var(--text-color);
        transition: all 0.3s ease;
        border-left: 5px solid var(--todo-item-accent, var(--accent-color));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .todo-item.completed {
        opacity: 0.7;
        border-left-color: var(--bg-quaternary);
      }

      .todo-item.completed .todo-title {
        text-decoration: line-through;
      }

      .todo-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .todo-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0;
        gap: 10px;
        flex-wrap: wrap;
      }

      .todo-title {
        font-size: 16px;
        font-weight: bold;
        color: var(--text-color);
        margin: 0;
      }

      .todo-due-date {
        font-size: 14px;
        color: var(--accent-color);
        background-color: rgba(var(--accent-color-rgb), 0.18);
        padding: 4px 8px;
        border-radius: 6px;
      }

      .todo-due-date.overdue {
        background-color: rgba(255, 107, 107, 0.2);
        color: var(--delete-btn);
      }

      .todo-due-date.today {
        background-color: rgba(var(--accent-color-rgb), 0.26);
        color: var(--accent-color);
        font-weight: bold;
      }

      .todo-description {
        font-size: 13px;
        color: var(--muted-text-color);
        margin-bottom: 0;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .todo-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .todo-footer > * {
        min-width: 0;
      }

      .todo-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        min-height: 0;
      }

      .todo-tag {
        font-size: 12px;
        padding: 4px 8px;
        background-color: var(--bg-quaternary);
        border-radius: 4px;
        color: var(--text-color);
      }

      .todo-actions {
        display: flex;
        gap: 8px;
      }

      .todo-action-stack {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .todo-action-btn {
        padding: 6px 12px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
      }

      .todo-progress-btn {
        background: color-mix(
          in srgb,
          var(--accent-color) 18%,
          var(--bg-quaternary)
        );
        color: var(--accent-color);
        border: 1px solid
          color-mix(in srgb, var(--accent-color) 45%, transparent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        text-align: center;
      }

      .complete-btn {
        background-color: var(--accent-color);
        color: var(--on-accent-text);
      }

      .delete-btn {
        background-color: var(--delete-btn);
        color: white;
      }

      .edit-btn {
        background-color: var(--bg-quaternary);
        color: var(--text-color);
      }

      .todo-action-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .checkin-record {
        background-color: color-mix(
          in srgb,
          var(--bg-secondary) 78%,
          transparent
        );
        border-radius: 16px;
        padding: 8px 10px;
        margin-top: 8px;
      }

      .todo-progress-lane {
        flex: 1 1 220px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .todo-progress-caption,
      .todo-progress-empty {
        color: var(--muted-text-color);
      }

      .checkin-records-inline {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 2px;
        scrollbar-width: thin;
        max-width: 100%;
      }

      .checkin-records-inline .checkin-record {
        margin-top: 0;
        flex: 0 0 auto;
      }

      .checkin-records-inline .checkin-message,
      .checkin-item .checkin-description {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .checkin-records-inline .checkin-message {
        -webkit-line-clamp: 1;
      }

      .checkin-item {
        box-sizing: border-box;
      }

      .todo-progress-record {
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
        border: 1px solid transparent;
      }

      .todo-progress-record:hover {
        transform: translateY(-1px);
        border-color: rgba(var(--accent-color-rgb), 0.28);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      }

      .checkin-date {
        font-size: 12px;
        color: var(--muted-text-color);
      }

      .checkin-message {
        font-size: 14px;
        color: var(--text-color);
      }

      .category-filter {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 15px;
      }

      .todo-control-strip {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 12px;
        overflow: visible;
      }

      .todo-dropdown-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        min-width: 0;
      }

      .todo-dropdown-field {
        flex: 0 0 auto;
        min-width: 0;
      }

      .todo-dropdown-field .tree-select,
      .todo-dropdown-field .native-select-enhancer {
        width: fit-content;
        max-width: 100%;
        min-width: 0;
      }

      .filter-btn {
        padding: 8px 16px;
        border-radius: 8px;
        background-color: var(--bg-tertiary);
        color: var(--text-color);
        border: none;
        cursor: pointer;
        transition: all 0.2s;
      }

      .filter-btn.active {
        background-color: var(--accent-color);
        color: var(--on-accent-text);
      }

      .filter-btn:hover {
        background-color: var(--accent-color);
        color: var(--on-accent-text);
      }

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-color);
      }

      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 15px;
      }

      .todo-tools-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 15px;
        align-items: center;
      }

      .todo-tools-field {
        min-width: 0;
      }

      .todo-tools-input {
        width: 100%;
        box-sizing: border-box;
      }

      .todo-view-toggle .bts.active {
        background-color: var(--accent-color);
        color: var(--button-text);
      }

      .todo-primary-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .todo-primary-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .calendar-container {
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: auto;
        gap: 14px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .plan-calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .plan-view-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .plan-date-nav-group {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        margin-left: auto;
        min-width: 0;
      }

      .plan-current-date-display {
        color: var(--text-color);
        font-weight: bold;
        font-size: 18px;
        min-width: 0;
        white-space: nowrap;
        line-height: 1.1;
      }

      .plan-nav-buttons {
        display: flex;
        gap: 6px;
        align-items: center;
        flex: 0 0 auto;
      }

      .plan-nav-buttons .bts {
        white-space: nowrap;
        flex: 0 0 auto;
      }

      .plan-today-btn {
        white-space: nowrap;
        word-break: keep-all;
        writing-mode: horizontal-tb;
      }

      .plan-calendar-content-card {
        resize: none;
        position: relative;
        overflow: visible;
        min-height: auto !important;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01)),
          color-mix(in srgb, var(--bg-tertiary) 78%, transparent);
        border: 1px solid color-mix(in srgb, var(--panel-border-color) 58%, transparent);
        box-shadow: none;
        border-radius: 20px;
        padding: 16px;
      }

      .plan-calendar-render-host {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
        width: 100%;
        min-height: 0;
      }

      .plan-week-helper {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        min-width: 0;
        margin: 0;
      }

      .plan-week-helper-text {
        color: var(--text-color);
        font-size: var(--plan-week-helper-font-size, 14px);
      }

      #stats-container {
        display: flex;
        flex-direction: column;
        min-height: auto !important;
        height: auto;
        overflow: visible;
        gap: 16px;
        border-radius: 20px;
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      #todo-list-container,
      #todo-quadrant-container,
      #checkin-list-container {
        flex: 0 0 auto;
        min-height: auto !important;
        width: 100%;
        overflow: visible;
      }

      #todo-panel-anchor,
      #todo-panel-anchor .todo-panel-stack,
      #todo-view-controls,
      #checkin-view-controls {
        overflow: visible;
      }

      body.page-plan .planner-dashboard,
      body.page-plan .planner-panel--plans,
      body.page-plan #stats-container,
      body.page-plan .calendar-container,
      body.page-plan .plan-calendar-render-host,
      body.page-plan #calendar-content,
      body.page-plan .plan-calendar-content-card,
      body.page-plan .weekly-glass-shell {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        height: auto !important;
        min-height: auto !important;
        max-height: none !important;
        box-sizing: border-box;
        align-self: stretch;
        flex: 0 0 auto;
      }

      body.page-plan .planner-panel--plans,
      body.page-plan #stats-container,
      body.page-plan .calendar-container,
      body.page-plan .plan-calendar-render-host {
        display: flex;
        flex-direction: column;
        min-height: auto !important;
        overflow: hidden !important;
      }

      body.page-plan #calendar-content {
        display: flex;
        flex-direction: column;
        min-height: auto !important;
        overflow: visible !important;
      }

      @media (min-width: 691px) {
        .planner-dashboard {
          align-items: stretch;
        }

        .planner-dashboard > .planner-panel {
          height: auto;
        }

        body.page-plan .planner-panel--plans {
          padding: 0;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          border-radius: 0;
        }

        #todo-panel-anchor .todo-panel-stack > :last-child {
          margin-top: auto;
        }
      }

      @media (max-width: 1280px) {
        .planner-dashboard {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      @media (max-width: 980px) and (min-width: 691px) {
        .plan-calendar-header {
          align-items: stretch;
        }

        .plan-view-buttons {
          flex: 1 1 100%;
          width: 100%;
          min-width: 0;
        }

        .plan-view-buttons .bts {
          flex: 1 1 0;
          min-width: 0;
        }

        .plan-date-nav-group {
          width: 100%;
          min-width: 0;
          margin-left: 0;
          gap: 10px;
        }

        .plan-current-date-display {
          font-size: 16px;
          overflow: visible;
          text-overflow: clip;
          letter-spacing: -0.01em;
        }
      }

      @media (max-width: 760px) {
        .todo-tools-row {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 690px) {
        body.page-plan {
          --plan-fab-size: 68px;
          --plan-fab-icon-size: 26px;
          --plan-fab-offset-right: max(
            12px,
            calc(env(safe-area-inset-right, 0px) + 8px)
          );
          --plan-fab-offset-bottom: max(
            calc(var(--plan-fab-size) + 8px),
            calc(env(safe-area-inset-bottom, 0px) + var(--plan-fab-size) + 4px)
          );
        }

        body.page-plan.controler-android-native {
          --plan-fab-offset-bottom: max(
            calc(var(--plan-fab-size) + 10px),
            calc(env(safe-area-inset-bottom, 0px) + var(--plan-fab-size) + 6px)
          );
        }

        body.page-plan .plan-main {
          box-sizing: border-box;
          padding-bottom: 12px;
        }

        body.page-plan .planner-dashboard {
          display: flex;
          flex-direction: row;
          gap: 0;
          width: 100%;
          max-width: none;
          margin: 0;
          padding: 0 0 6px;
          min-height: 0;
          height: auto;
          overflow-x: auto;
          overflow-y: hidden;
          scroll-snap-type: x mandatory;
          scroll-snap-stop: always;
          scroll-behavior: smooth;
          scrollbar-width: none;
          overscroll-behavior-x: contain;
          overscroll-behavior-y: auto;
          contain: paint;
        }

        body.page-plan .planner-dashboard[data-pager-mode="mobile"] {
          -webkit-overflow-scrolling: touch;
          touch-action: pan-x pan-y;
        }

        body.page-plan .planner-dashboard[data-pager-mode="desktop"] {
          touch-action: pan-y;
        }

        body.page-plan .planner-dashboard .planner-panel--todos {
          order: -1;
        }

        body.page-plan .planner-dashboard .planner-panel--plans {
          order: 1;
          padding: 0;
          border-radius: 0;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
        }

        body.page-plan .planner-dashboard::-webkit-scrollbar {
          display: none;
        }

        body.page-plan .planner-dashboard .planner-panel {
          flex: 0 0 100%;
          width: 100%;
          min-height: 0;
          height: auto;
          padding: 12px;
          border-radius: 12px;
          scroll-snap-align: start;
          scroll-snap-stop: always;
          contain: paint;
        }

        body.page-plan .planner-dashboard,
        body.page-plan .planner-dashboard .planner-panel,
