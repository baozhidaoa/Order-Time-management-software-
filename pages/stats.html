<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时间统计</title>
    <script src="desktop-theme-preload.js"></script>
    <script defer src="offline-assets/offline-assets-manifest.js"></script>
    <script defer src="desktop-common-boot.js"></script>
    <script defer src="stats-boot.js"></script>
    <link rel="stylesheet" href="index.css" />
</head>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        height: auto;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
      }

      .stats-main {
        min-height: 0;
        overflow-x: hidden;
      }
    </style>
  <body class="app-layout page-stats stats-toolbar-bootstrap-pending bkg flex row">
    <!-- 侧边栏 -->
    <div
      class="app-sidebar flex column ms mgt mgb"
    >
      <div class="app-sidebar-spacer flex ms"></div>
      <!-- 导航栏 -->
      <div class="app-nav flex flex1 column ms mgt">
        <button class="app-nav-button" type="button" data-nav-page="index" onclick="if (window.ControlerUI?.navigateAppPage?.('index')) return false; window.location.href = 'index.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="7.25"></circle>
              <path d="M12 8.35v4.1l2.65 1.7"></path>
            </svg>
          </span>
          <span class="app-nav-label">记录</span>
        </button>
        <button class="app-nav-button" type="button" data-nav-page="stats" onclick="if (window.ControlerUI?.navigateAppPage?.('stats')) return false; window.location.href = 'stats.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 19.25h15"></path>
              <path d="M7.25 17.75v-5.5"></path>
              <path d="M12 17.75V7.25"></path>
              <path d="M16.75 17.75v-8"></path>
            </svg>
          </span>
          <span class="app-nav-label">统计</span>
        </button>
        <button class="app-nav-button" type="button" data-nav-page="plan" onclick="if (window.ControlerUI?.navigateAppPage?.('plan')) return false; window.location.href = 'plan.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4.5" y="5.75" width="15" height="13.25" rx="3"></rect>
              <path d="M8 3.75v4"></path>
              <path d="M16 3.75v4"></path>
              <path d="M4.5 9.75h15"></path>
            </svg>
          </span>
          <span class="app-nav-label">计划</span>
        </button>
        <button class="app-nav-button" type="button" data-nav-page="todo" onclick="if (window.ControlerUI?.navigateAppPage?.('todo')) return false; window.location.href = 'todo.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5.25" y="4.75" width="13.5" height="14.5" rx="3"></rect>
              <path d="M8.5 9.25h6.75"></path>
              <path d="M8.5 13h6.75"></path>
              <path d="M8.5 16.75h4.25"></path>
              <path d="M6.8 9.2h.01"></path>
              <path d="M6.8 12.95h.01"></path>
              <path d="M6.8 16.7h.01"></path>
            </svg>
          </span>
          <span class="app-nav-label">待办</span>
        </button>
        <button class="app-nav-button" type="button" data-nav-page="diary" onclick="if (window.ControlerUI?.navigateAppPage?.('diary')) return false; window.location.href = 'diary.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 4.75h7.25L18 8.5V19.25H7a2.25 2.25 0 0 1-2.25-2.25V7A2.25 2.25 0 0 1 7 4.75Z"></path>
              <path d="M14.25 4.75V8.5H18"></path>
              <path d="M8.5 12h6.5"></path>
              <path d="M8.5 15h4.5"></path>
            </svg>
          </span>
          <span class="app-nav-label">日记</span>
        </button>
        <button class="app-nav-button" type="button" data-nav-page="settings" onclick="if (window.ControlerUI?.navigateAppPage?.('settings')) return false; window.location.href = 'settings.html'; return false;">
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8.7a3.3 3.3 0 1 0 0 6.6a3.3 3.3 0 0 0 0-6.6Z"></path>
              <path d="M19.15 13.1V10.9l-1.76-.46a5.83 5.83 0 0 0-.54-1.31l.95-1.56l-1.55-1.56l-1.57.95a5.86 5.86 0 0 0-1.3-.53L13.1 4.7h-2.2l-.46 1.73c-.46.12-.9.3-1.31.53l-1.56-.95L6.02 7.57l.95 1.56c-.23.41-.41.85-.53 1.31l-1.74.46v2.2l1.74.46c.12.46.3.9.53 1.31l-.95 1.56l1.55 1.56l1.56-.95c.41.23.85.41 1.31.53l.46 1.74h2.2l.46-1.74c.45-.12.89-.3 1.3-.53l1.57.95l1.55-1.56l-.95-1.56c.23-.41.42-.85.54-1.31Z"></path>
            </svg>
          </span>
          <span class="app-nav-label">设置</span>
        </button>
      </div>
    </div>
    <!-- 主要内容区域 -->
    <div
      class="app-main stats-main flex flex1 column mg ms"
    >
      <div
        id="stats-loading-overlay"
        class="page-loading-overlay"
        data-mode="fullscreen"
        data-controler-overlay-scope="viewport"
        aria-hidden="true"
        hidden
      >
        <div class="page-loading-card">
          <div class="page-loading-title" data-loading-title>正在加载数据中</div>
          <div class="page-loading-message" data-loading-message>
            正在整理统计索引与范围数据，请稍候
          </div>
        </div>
      </div>

      <div
        class="stats-shell page-shell page-shell--fill"
      >
        <div class="page-shell-heading">
          <div class="page-shell-heading-copy">
            <h3 class="page-shell-heading-title">统计</h3>
          </div>
        </div>
        <div class="stats-toolbar-shell page-control-card">
          <div id="stats-toolbar" class="stats-toolbar">
            <div class="stats-toolbar-group stats-toolbar-group--sections">
              <select id="stats-section-select">
                <option value="table">表格视图</option>
                <option value="charts">饼状图和折线图</option>
                <option value="heatmap">日历热图</option>
              </select>
            </div>

            <div class="stats-toolbar-group stats-toolbar-group--range">
              <div class="stats-range-control-strip">
                <button
                  class="bts time-quick-btn stats-range-step-btn"
                  id="stats-range-prev"
                  type="button"
                  aria-label="上一时间范围"
                >
                  &lt;
                </button>
                <select id="stats-range-unit-select">
                  <option value="today">今天</option>
                  <option value="day">天</option>
                  <option value="week">周</option>
                  <option value="month">月</option>
                  <option value="year">年</option>
                </select>
                <button
                  class="bts time-quick-btn stats-range-step-btn"
                  id="stats-range-next"
                  type="button"
                  aria-label="下一时间范围"
                >
                  &gt;
                </button>
              </div>
            </div>

            <div class="stats-toolbar-group stats-toolbar-group--dates">
              <label class="stats-date-field" for="start-date-select">
                <span>开始日期</span>
                <input type="date" id="start-date-select" class="date-input themed-native-picker-input" />
              </label>

              <label class="stats-date-field" for="end-date-select">
                <span>结束日期</span>
                <input type="date" id="end-date-select" class="date-input themed-native-picker-input" />
              </label>
            </div>
          </div>
        </div>

        <!-- 统计内容容器 -->
        <div
          id="stats-container"
          class="resizable-panel stats-content-shell"
        >
          <div class="stats-placeholder">
            选择时间范围并使用上方折叠按钮查看统计
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
