<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时间跟踪器</title>
    <script src="desktop-theme-preload.js"></script>
    <script defer src="offline-assets/offline-assets-manifest.js"></script>
    <script defer src="desktop-common-boot.js"></script>
    <script defer src="index-boot.js"></script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      height: auto;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
        sans-serif;
    }
    /* 移除调试边框 */
    /* * {
      border: 1px solid transparent;
    } */
  </style>
  <body
    class="app-layout page-record record-bootstrap-pending flex row bgs bkg"
  >
    <!-- 侧边栏 -->
    <div class="app-sidebar flex column mgt mgb">
      <div class="app-sidebar-spacer flex ms"></div>
      <!-- 导航栏 -->
      <div class="app-nav flex flex1 column ms mgt">
        <button
          class="app-nav-button"
          type="button"
          data-nav-page="index"
          onclick="
            if (window.ControlerUI?.navigateAppPage?.('index')) return false;
            window.location.href = 'index.html';
            return false;
          "
        >
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="7.25"></circle>
              <path d="M12 8.35v4.1l2.65 1.7"></path>
            </svg>
          </span>
          <span class="app-nav-label">记录</span>
        </button>
        <button
          class="app-nav-button"
          type="button"
          data-nav-page="stats"
          onclick="
            if (window.ControlerUI?.navigateAppPage?.('stats')) return false;
            window.location.href = 'stats.html';
            return false;
          "
        >
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 19.25h15"></path>
              <path d="M7.25 17.75v-5.5"></path>
              <path d="M12 17.75V7.25"></path>
              <path d="M16.75 17.75v-8"></path>
            </svg>
          </span>
          <span class="app-nav-label">统计</span>
        </button>
        <button
          class="app-nav-button"
          type="button"
          data-nav-page="plan"
          onclick="
            if (window.ControlerUI?.navigateAppPage?.('plan')) return false;
            window.location.href = 'plan.html';
            return false;
          "
        >
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4.5" y="5.75" width="15" height="13.25" rx="3"></rect>
              <path d="M8 3.75v4"></path>
              <path d="M16 3.75v4"></path>
              <path d="M4.5 9.75h15"></path>
            </svg>
          </span>
          <span class="app-nav-label">计划</span>
        </button>
        <button
          class="app-nav-button"
          type="button"
          data-nav-page="todo"
          onclick="
            if (window.ControlerUI?.navigateAppPage?.('todo')) return false;
            window.location.href = 'todo.html';
            return false;
          "
        >
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5.25" y="4.75" width="13.5" height="14.5" rx="3"></rect>
              <path d="M8.5 9.25h6.75"></path>
              <path d="M8.5 13h6.75"></path>
              <path d="M8.5 16.75h4.25"></path>
              <path d="M6.8 9.2h.01"></path>
              <path d="M6.8 12.95h.01"></path>
              <path d="M6.8 16.7h.01"></path>
            </svg>
          </span>
          <span class="app-nav-label">待办</span>
        </button>
        <button
          class="app-nav-button"
          type="button"
          data-nav-page="diary"
          onclick="
            if (window.ControlerUI?.navigateAppPage?.('diary')) return false;
            window.location.href = 'diary.html';
            return false;
          "
        >
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 4.75h7.25L18 8.5V19.25H7a2.25 2.25 0 0 1-2.25-2.25V7A2.25 2.25 0 0 1 7 4.75Z"></path>
              <path d="M14.25 4.75V8.5H18"></path>
              <path d="M8.5 12h6.5"></path>
              <path d="M8.5 15h4.5"></path>
            </svg>
          </span>
          <span class="app-nav-label">日记</span>
        </button>
        <button
          class="app-nav-button"
          type="button"
          data-nav-page="settings"
          onclick="
            if (window.ControlerUI?.navigateAppPage?.('settings')) return false;
            window.location.href = 'settings.html';
            return false;
          "
        >
          <span class="app-nav-icon" aria-hidden="true">
            <svg class="app-nav-icon-svg" viewBox="0 0 24 24" role="presentation" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8.7a3.3 3.3 0 1 0 0 6.6a3.3 3.3 0 0 0 0-6.6Z"></path>
              <path d="M19.15 13.1V10.9l-1.76-.46a5.83 5.83 0 0 0-.54-1.31l.95-1.56l-1.55-1.56l-1.57.95a5.86 5.86 0 0 0-1.3-.53L13.1 4.7h-2.2l-.46 1.73c-.46.12-.9.3-1.31.53l-1.56-.95L6.02 7.57l.95 1.56c-.23.41-.41.85-.53 1.31l-1.74.46v2.2l1.74.46c.12.46.3.9.53 1.31l-.95 1.56l1.55 1.56l1.56-.95c.41.23.85.41 1.31.53l.46 1.74h2.2l.46-1.74c.45-.12.89-.3 1.3-.53l1.57.95l1.55-1.56l-.95-1.56c.23-.41.42-.85.54-1.31Z"></path>
            </svg>
          </span>
          <span class="app-nav-label">设置</span>
        </button>
      </div>
    </div>
    <!-- 主要内容区域 -->
    <div class="app-main record-main flex flex1 column mg ms">
      <div class="record-topbar page-topbar flex juzhong ms mg">
        <h2 class="page-title">时间记录</h2>
      </div>
      <div id="record-guide-card" class="guide-card-host ms mg" hidden></div>
      <div
        id="record-loading-overlay"
        class="page-loading-overlay"
        data-mode="fullscreen"
        data-controler-overlay-scope="viewport"
        aria-hidden="true"
        hidden
      >
        <div class="page-loading-card">
          <div class="page-loading-title" data-loading-title>
            正在加载数据中
          </div>
          <div class="page-loading-message" data-loading-message>
            正在读取记录与项目，请稍候
          </div>
        </div>
      </div>

      <div class="record-shell page-shell page-shell--fill">
        <div class="page-shell-heading">
          <div class="page-shell-heading-copy">
            <h3 class="page-shell-heading-title">时间记录</h3>
          </div>
          <div class="page-shell-heading-actions">
            <button
              class="bts record-create-project-btn"
              id="open-create-project-modal-btn"
              type="button"
            >
              <span class="record-create-project-btn__icon" aria-hidden="true"
                >+</span
              >
              <span>创建项目</span>
            </button>
          </div>
        </div>
        <!-- 项目创建和展示区域 -->
        <div class="flex column resizable-panel" id="project-container">
          <section
            class="record-section-block"
            id="record-hierarchy-section"
            aria-label="三级分类系统"
          >
            <div class="record-section-body">
              <div
                id="projects-table-container"
                style="display: block; margin-bottom: 0"
              >
                <div
                  class="projects-table resizable-panel"
                  id="projects-table"
                  style="
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                    gap: 10px;
                    overflow: auto;
                    min-height: 200px;
                  "
                >
                  <!-- 表格视图将动态添加到这里 -->
                </div>
              </div>
            </div>
          </section>

          <section
            class="record-section-block"
            id="project-totals-section"
            aria-label="项目总时长"
          >
            <div class="record-section-body">
              <div
                class="project-totals"
                id="project-totals"
                style="margin-top: 0; color: var(--text-color); font-size: 14px"
              >
                <!-- 项目总用时将显示在这里 -->
              </div>
            </div>
          </section>
        </div>

        <div
          class="flex column resizable-panel record-output-panel"
          aria-label="记录列表"
        >
          <div
            id="output"
            class="record-output-surface"
            style="flex: 1 1 auto; overflow-y: auto"
          ></div>
          <button
            class="bts record-floating-timer-btn"
            id="spend"
            type="button"
            aria-label="开始计时"
            title="开始计时"
          >
            <span class="record-floating-timer-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <circle cx="12" cy="12" r="7"></circle>
                <path d="M12 8.8v3.7l2.45 1.65"></path>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>
    <!-- 弹窗模态框 -->
    <div
      class="modal-overlay controler-form-modal-overlay timer-session-modal-overlay"
      id="modal-overlay"
      data-controler-modal-persistent="true"
      data-controler-disable-autofocus="true"
      data-controler-managed-android-focus="true"
      data-controler-managed-field-reveal="false"
      style="display: none"
    >
      <div
        class="modal-content ms controler-form-modal timer-session-modal"
        style="padding: 20px; border-radius: 15px; max-width: 500px; width: 90%"
      >
        <div class="controler-form-modal-body timer-session-modal-body">
          <h2 style="margin-top: 0; color: var(--text-color)">配置计时</h2>

          <div class="form-group" style="margin-bottom: 15px">
            <label
              style="
                color: var(--text-color);
                display: block;
                margin-bottom: 5px;
              "
              >当前项目</label
            >
            <div class="input-with-suggestions">
              <input
                type="text"
                id="project-name-input"
                placeholder="输入或选择本次计时项目"
                style="
                  width: 100%;
                  padding: 10px;
                  border-radius: 8px;
                  border: 1px solid var(--bg-tertiary);
                  background-color: var(--bg-quaternary);
                  color: var(--text-color);
                  font-size: 16px;
                "
              />
              <div
                id="project-name-suggestions"
                class="suggestion-popover"
              ></div>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 15px">
            <label
              style="
                color: var(--text-color);
                display: block;
                margin-bottom: 5px;
              "
              >用时</label
            >
            <div
              style="
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
              "
            >
              <div style="flex: 1; color: var(--text-color)">
                <div style="font-size: 13px; font-weight: bold">
                  当前用时: <span id="spendtime-display">小于1min</span>
                </div>
              </div>
              <div style="color: var(--text-color); font-size: 14px">
                剩余: <span id="remaining-time">-</span>
              </div>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 15px">
            <label
              style="
                color: var(--text-color);
                display: block;
                margin-bottom: 5px;
              "
              >缩短时间</label
            >
            <div
              style="
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
              "
            >
              <div style="display: flex; align-items: center; gap: 5px">
                <input
                  type="number"
                  id="shorten-hours"
                  placeholder="小时"
                  min="0"
                  style="
                    width: 70px;
                    padding: 8px;
                    border-radius: 8px;
                    border: 1px solid var(--input-border-color);
                    background-color: var(--bg-quaternary);
                    color: var(--text-color);
                    position: relative;
                    z-index: 1;
                  "
                />
                <span style="color: var(--text-color)">h</span>
                <input
                  type="number"
                  id="shorten-minutes"
                  placeholder="分钟"
                  min="0"
                  max="59"
                  style="
                    width: 70px;
                    padding: 8px;
                    border-radius: 8px;
                    border: 1px solid var(--input-border-color);
                    background-color: var(--bg-quaternary);
                    color: var(--text-color);
                    position: relative;
                    z-index: 1;
                  "
                />
                <span style="color: var(--text-color)">min</span>
              </div>
            </div>
            <div
              id="shorten-error"
              style="color: var(--delete-btn); font-size: 12px; display: none"
            >
              缩短时间不能超过当前时长，且不能小于1分钟
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 15px">
            <label
              style="
                color: var(--text-color);
                display: block;
                margin-bottom: 5px;
              "
              >下一个项目</label
            >
            <div class="input-with-suggestions">
              <input
                type="text"
                id="next-project-input"
                placeholder="例如：一级盒子/二级盒子"
                style="
                  width: 100%;
                  padding: 10px;
                  border-radius: 8px;
                  border: 1px solid var(--bg-tertiary);
                  background-color: var(--bg-quaternary);
                  color: var(--text-color);
                  font-size: 16px;
                "
              />
              <div
                id="next-project-suggestions"
                class="suggestion-popover"
              ></div>
            </div>
            <div
              class="existing-projects"
              id="existing-projects"
              style="
                margin-top: 8px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 8px;
                border-radius: 10px;
                padding: 8px;
                max-height: 140px;
                overflow-y: auto;
              "
            >
              <!-- 已创建项目将动态添加到这里 -->
            </div>
          </div>
        </div>
        <div class="modal-buttons controler-form-modal-footer">
          <div class="controler-form-modal-footer-actions">
            <button class="bts" id="modal-cancel">取消</button>
            <button class="bts" id="modal-confirm">确定</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 高级创建项目模态框 -->
    <div
      class="modal-overlay"
      id="advanced-modal-overlay"
      data-controler-modal-persistent="true"
      style="display: none"
    >
      <div
        class="modal-content ms"
        style="padding: 20px; border-radius: 15px; max-width: 500px; width: 90%"
      >
        <h2 style="margin-top: 0; color: var(--text-color)">高级创建项目</h2>

        <div class="form-group" style="margin-bottom: 15px">
          <label
            style="color: var(--text-color); display: block; margin-bottom: 5px"
            >项目名称</label
          >
          <input
            type="text"
            id="advanced-project-name"
            placeholder="输入项目名称"
            style="
              width: 100%;
              padding: 10px;
              border-radius: 8px;
              border: 1px solid var(--input-border-color);
              background-color: var(--bg-quaternary);
              color: var(--text-color);
              font-size: 16px;
            "
          />
        </div>

        <div class="form-group" style="margin-bottom: 15px">
          <label
            style="color: var(--text-color); display: block; margin-bottom: 5px"
            >项目层级</label
          >
          <div style="display: flex; gap: 10px">
            <label
              style="
                display: flex;
                align-items: center;
                color: var(--text-color);
              "
            >
              <input type="radio" name="project-level" value="1" checked />
              <span style="margin-left: 5px">一级项目</span>
            </label>
            <label
              style="
                display: flex;
                align-items: center;
                color: var(--text-color);
              "
            >
              <input type="radio" name="project-level" value="2" />
              <span style="margin-left: 5px">二级项目</span>
            </label>
            <label
              style="
                display: flex;
                align-items: center;
                color: var(--text-color);
              "
            >
              <input type="radio" name="project-level" value="3" />
              <span style="margin-left: 5px">三级项目</span>
            </label>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px">
          <label
            style="color: var(--text-color); display: block; margin-bottom: 5px"
            >父级项目</label
          >
          <select
            id="parent-project-select"
            class="project-parent-select-native"
            style="
              width: 100%;
              padding: 10px 14px;
              border-radius: 16px;
              border: 1px solid var(--input-border-color);
              background-color: var(--surface-control, var(--bg-quaternary));
              color: var(--text-color);
              font-size: 16px;
            "
          >
            <option value="">请选择父级项目</option>
            <!-- 父级项目将动态添加 -->
          </select>
        </div>

        <div class="form-group project-color-panel" style="margin-bottom: 15px">
          <label
            style="color: var(--text-color); display: block; margin-bottom: 5px"
            >项目颜色</label
          >
          <div class="project-color-picker-row">
            <input
              type="color"
              id="project-color-picker"
              class="project-color-input"
              style="width: 50px; height: 50px; cursor: pointer"
              value="#79af85"
            />
            <button
              class="bts project-color-random-btn"
              id="project-color-random-btn"
              type="button"
            >
              随机色
            </button>
            <div class="project-color-picker-copy">
              <div
                id="project-color-current"
                class="project-color-current-value"
                aria-live="polite"
              >
                #79AF85
              </div>
            </div>
          </div>
          <div
            id="project-color-presets"
            class="project-color-palette"
            role="list"
            aria-label="项目颜色推荐色板"
          ></div>
        </div>

        <div
          class="modal-buttons"
          style="
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
          "
        >
          <button class="bts" id="advanced-modal-cancel">取消</button>
          <button class="bts" id="advanced-modal-confirm">确定创建</button>
        </div>
      </div>
    </div>
  </body>
</html>
